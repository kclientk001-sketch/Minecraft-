name: Validate Minecraft Network
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./dev.db
      APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - run: npm run build:inet
      - run: npm run test:inet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            playwright-report/
            docs/screenshots/
            inet-site/
          retention-days: 14
